<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成績看板 — VisualDS Exam（老師)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  .wrap { max-width: 1080px; margin: 0 auto; padding: 44px 26px 80px; }
  h1 { font-size: 1.5rem; font-weight: 800; color: var(--amber-bright); letter-spacing: .05em;
    text-transform: uppercase; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 20px 0; }
  .bar input, .bar select { background: var(--bg); border: 1px solid var(--border); color: var(--amber-bright);
    font-family: var(--font-mono); font-size: .9rem; padding: 9px 11px; border-radius: 7px; }
  .bar input:focus, .bar select:focus { outline: none; border-color: var(--amber); }
  .btn { cursor: pointer; font-family: var(--font-mono); font-weight: 700; font-size: .82rem; padding: 9px 16px;
    border-radius: 7px; border: 1px solid var(--amber-dim); background: rgba(255,176,0,.08); color: var(--amber);
    letter-spacing: .04em; transition: all .15s; }
  .btn:hover { background: var(--amber); color: var(--bg); }
  .btn.danger { border-color: var(--error); color: var(--error); background: rgba(255,80,80,.08); }
  .btn.danger:hover { background: var(--error); color: var(--bg); }
  .bar label { font-size: .74rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }

  .cfg-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 9px;
    padding: 12px 16px; margin-bottom: 18px; }
  .cfg-panel summary { cursor: pointer; font-size: .82rem; color: var(--amber); font-weight: 700; }
  .cfg-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .cfg-row label { font-size: .76rem; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .cfg-row select, .cfg-row input { background: var(--bg); border: 1px solid var(--border); color: var(--amber-bright);
    font-family: var(--font-mono); font-size: .82rem; padding: 7px 9px; border-radius: 6px; }
  .cfg-sets { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 14px; }
  .cfg-set-title { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-dim); margin-bottom: 8px; }
  .chap-checks { display: grid; grid-template-columns: repeat(2, auto); gap: 5px 16px; }
  .chap-checks label { font-size: .76rem; color: var(--text-dim); display: flex; align-items: center; gap: 6px; cursor: pointer; }

  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .scard { background: var(--bg-card); border: 1px solid var(--border); border-radius: 9px; padding: 12px 16px; }
  .scard .k { font-size: .62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
  .scard .v { font-size: 1.5rem; font-weight: 800; color: var(--amber); margin-top: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th, td { border-bottom: 1px solid var(--border); padding: 9px 10px; text-align: left; }
  th { color: var(--amber-dim); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; user-select: none; }
  th:hover { color: var(--amber); }
  td { color: var(--text); }
  td.num { text-align: right; font-weight: 700; color: var(--amber-bright); }
  tr:hover td { background: rgba(255,176,0,.04); }
  .pct-hi { color: var(--success); } .pct-lo { color: var(--error); }

  .ip-tag { display: inline-block; font-size: .62rem; color: var(--warn); border: 1px solid var(--warn);
    border-radius: 4px; padding: 0 5px; margin-left: 8px; }
  .msg { color: var(--text-dim); font-size: .85rem; margin: 14px 0; }
  .msg.bad { color: var(--error); }
  .sec-label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--amber-dim);
    margin: 26px 0 10px; }

  /* score matrix */
  #matrix-wrap { overflow-x: auto; }
  table.matrix th { text-align: right; vertical-align: bottom; white-space: nowrap; }
  table.matrix th[data-mk="studentId"] { text-align: left; }
  table.matrix td:first-child { white-space: nowrap; }
  .cfg-max { font-size: .58rem; color: var(--text-muted); font-weight: 400; letter-spacing: 0; }
  table.matrix td.tot { font-size: 1rem; }
  table.matrix .dash { color: var(--text-muted); }
  table.matrix tr.avg-row td { border-top: 2px solid var(--amber-dim); color: var(--amber-dim);
    font-style: italic; background: rgba(255,176,0,.03); }
  table.matrix td.avg { color: var(--amber-dim); }

  /* chapter-points editor */
  .pts-grid { display: grid; grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 6px 22px; margin-top: 6px; }
  .pts-grid label { font-size: .74rem; color: var(--text-dim); display: flex; align-items: center;
    justify-content: space-between; gap: 8px; }
  .pts-grid input { width: 56px; }
  .pts-sum { font-size: .74rem; color: var(--amber); margin-top: 10px; }
  .pts-sum.warn { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <h1>成績看板 · Teacher</h1>
  <div class="bar">
    <input id="token" type="password" placeholder="老師 token" autocomplete="off">
    <select id="filter"><option value="">全部章節</option></select>
    <button class="btn" id="load">載入</button>
    <label><input type="checkbox" id="auto"> 每 10 秒自動更新</label>
    <span class="msg" id="msg"></span>
  </div>

  <details class="cfg-panel" id="cfg-panel">
    <summary>⚙ 考試設定（階段 / 題組 / 時長）</summary>
    <div class="cfg-row">
      <label>階段：
        <select id="phase">
          <option value="off">關閉（全部開放 · 自己測試用）</option>
          <option value="practice">練習模式（不計分、可重做、不限時）</option>
          <option value="exam">正式考試（計分、一次、計時）</option>
        </select>
      </label>
      <label>考試時長（分鐘，0 = 不限）：<input id="exam-min" type="number" min="0" step="1" style="width:80px"></label>
      <button class="btn" id="set-cfg">套用設定</button>
      <span class="msg" id="cfg-msg"></span>
    </div>
    <div class="cfg-sets">
      <div class="cfg-set"><div class="cfg-set-title">練習題組</div><div id="prac-chaps" class="chap-checks"></div></div>
      <div class="cfg-set"><div class="cfg-set-title">正式題組</div><div id="exam-chaps" class="chap-checks"></div></div>
    </div>
    <div class="cfg-set" style="margin-top:16px">
      <div class="cfg-set-title">各章配分（總分 = Σ 配分×完成比例，封頂 100）</div>
      <div id="chap-points" class="pts-grid"></div>
      <div class="pts-sum" id="pts-sum"></div>
    </div>
    <div class="cfg-row" style="margin-top:18px; border-top:1px solid var(--border); padding-top:14px">
      <button class="btn danger" id="reset-data">🗑 清空所有成績（測試後歸零）</button>
      <span class="msg" id="reset-msg"></span>
    </div>
  </details>

  <div class="summary" id="summary"></div>
  <div class="sec-label" id="ip-label" style="display:none">進行中</div>
  <div id="inprogress"></div>

  <div class="sec-label">成績矩陣 · 正式題組（點欄頭排序）</div>
  <div id="matrix-wrap"></div>

  <details style="margin-top:26px">
    <summary class="sec-label" style="cursor:pointer; display:list-item">逐筆明細 · 原始紀錄</summary>
    <table id="tbl"><thead><tr>
      <th data-k="finishedAt">時間</th><th data-k="studentId">學號</th><th data-k="chapter">章節</th>
      <th data-k="percent">得分%</th><th data-k="earned">計分</th><th data-k="durationSec">用時</th><th data-k="seed">seed</th>
    </tr></thead><tbody id="tbody"></tbody></table>
  </details>
</div>

<script>
  const CH = { 'bst-delete':'BST 刪除','bst-insert':'BST 插入','bst-traversal':'BST 走訪',
    'dijkstra':'Dijkstra','dfs':'DFS','bubble-sort':'Bubble','selection-sort':'Selection','merge-sort':'Merge' };
  const $ = (id) => document.getElementById(id);
  let rows = [], sortK = 'finishedAt', sortDir = -1, timer = null;
  let matrix = [], chapPoints = {}, examCols = [], matSortK = 'total', matSortDir = -1;

  $('token').value = localStorage.getItem('vds_exam_token') || '';

  async function load() {
    const tok = $('token').value.trim();
    if (!tok) { msg('請輸入 token', true); return; }
    localStorage.setItem('vds_exam_token', tok);
    try {
      const r = await fetch('/api/results?token=' + encodeURIComponent(tok)).then((x) => x.json());
      if (r.error) { msg('載入失敗:' + r.error, true); return; }
      rows = r.finished || [];
      matrix = r.students || []; chapPoints = r.chapterPoints || {}; examCols = r.examChapters || [];
      renderInProgress(r.inProgress || []);
      buildFilter(); render(); renderMatrix(); loadConfig();
      msg(`已載入 ${rows.length} 筆 · ${new Date().toLocaleTimeString()}`);
    } catch (e) { msg('連線失敗:' + e.message, true); }
  }
  function msg(t, bad) { const m = $('msg'); m.className = 'msg' + (bad ? ' bad' : ''); m.textContent = t; }

  function buildFilter() {
    const sel = $('filter'), cur = sel.value;
    const chs = [...new Set(rows.map((r) => r.chapter))];
    sel.innerHTML = '<option value="">全部章節</option>' + chs.map((c) => `<option value="${c}">${CH[c] || c}</option>`).join('');
    sel.value = cur;
  }
  function fmtDur(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

  function render() {
    const f = $('filter').value;
    let list = f ? rows.filter((r) => r.chapter === f) : rows.slice();
    list.sort((a, b) => {
      let x = a[sortK], y = b[sortK];
      if (typeof x === 'string') return sortDir * String(x).localeCompare(String(y));
      return sortDir * ((x ?? 0) - (y ?? 0));
    });
    $('tbody').innerHTML = list.map((r) => `<tr>
      <td>${(r.finishedAt || '').replace('T', ' ').slice(0, 19)}</td>
      <td>${r.studentId}</td><td>${CH[r.chapter] || r.chapter}</td>
      <td class="num ${r.percent >= 60 ? 'pct-hi' : 'pct-lo'}">${r.percent}%</td>
      <td class="num">${r.earned}/${r.total}</td><td class="num">${fmtDur(r.durationSec || 0)}</td>
      <td>${r.seed ?? ''}</td></tr>`).join('');

    const n = list.length;
    const avg = n ? Math.round(list.reduce((s, r) => s + r.percent, 0) / n) : 0;
    const students = new Set(list.map((r) => r.studentId)).size;
    $('summary').innerHTML = `
      <div class="scard"><div class="k">提交數</div><div class="v">${n}</div></div>
      <div class="scard"><div class="k">學生數</div><div class="v">${students}</div></div>
      <div class="scard"><div class="k">平均完成度</div><div class="v">${avg}%</div></div>`;
  }

  function renderMatrix() {
    const cols = examCols;
    if (!cols.length || !matrix.length) {
      $('matrix-wrap').innerHTML = '<div class="msg">尚無正式題組成績（未設定正式題組，或還沒有人在此題組交卷）。</div>';
      return;
    }
    const list = matrix.slice().sort((a, b) => {
      if (matSortK === 'studentId') return matSortDir * String(a.studentId).localeCompare(String(b.studentId));
      const x = matSortK === 'total' ? a.total : (a.chapters[matSortK]?.points ?? -1);
      const y = matSortK === 'total' ? b.total : (b.chapters[matSortK]?.points ?? -1);
      return matSortDir * (x - y);
    });
    const head = `<tr>
      <th data-mk="studentId">學號</th>
      ${cols.map((c) => `<th data-mk="${c}" class="num">${CH[c] || c}<br><span class="cfg-max">/${chapPoints[c] ?? '?'}</span></th>`).join('')}
      <th data-mk="total" class="num">總分<br><span class="cfg-max">/100</span></th>
    </tr>`;
    const body = list.map((s) => `<tr>
      <td>${s.studentId}</td>
      ${cols.map((c) => { const cell = s.chapters[c];
        return `<td class="num">${cell ? cell.points.toFixed(1) : '<span class="dash">—</span>'}</td>`; }).join('')}
      <td class="num tot ${s.total >= 60 ? 'pct-hi' : 'pct-lo'}">${s.total}${s.total >= 100 ? ' ✓' : ''}</td>
    </tr>`).join('');
    const avgCell = (vals) => `<td class="num avg">${vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : '—'}</td>`;
    const avgRow = `<tr class="avg-row"><td>班平均</td>${
      cols.map((c) => avgCell(list.map((s) => s.chapters[c]?.points).filter((v) => v != null))).join('')
    }${avgCell(list.map((s) => s.total))}</tr>`;
    $('matrix-wrap').innerHTML = `<table class="matrix"><thead>${head}</thead><tbody>${body}${avgRow}</tbody></table>`;
    $('matrix-wrap').querySelectorAll('th[data-mk]').forEach((th) => th.addEventListener('click', () => {
      const k = th.dataset.mk;
      if (matSortK === k) matSortDir *= -1; else { matSortK = k; matSortDir = (k === 'studentId') ? 1 : -1; }
      renderMatrix();
    }));
  }

  function renderInProgress(ip) {
    $('ip-label').style.display = ip.length ? '' : 'none';
    $('inprogress').innerHTML = ip.length ? ip.map((s) =>
      `<span class="ip-tag">${s.studentId} · ${CH[s.chapter] || s.chapter} · ${s.progress}</span>`).join(' ') : '';
  }

  document.querySelectorAll('th[data-k]').forEach((th) => th.addEventListener('click', () => {
    const k = th.dataset.k; if (sortK === k) sortDir *= -1; else { sortK = k; sortDir = 1; } render();
  }));
  let cfgBuilt = false;
  function buildChecks(allChapters, prac, exam) {
    const set1 = new Set(prac), set2 = new Set(exam);
    const mk = (host, checked) => host.innerHTML = allChapters.map((c) =>
      `<label><input type="checkbox" value="${c}" ${checked.has(c) ? 'checked' : ''}>${CH[c] || c}</label>`).join('');
    mk($('prac-chaps'), set1); mk($('exam-chaps'), set2);
    cfgBuilt = true;
  }
  function buildPoints(allChapters, pts) {
    $('chap-points').innerHTML = allChapters.map((c) =>
      `<label>${CH[c] || c}<input type="number" min="0" step="1" data-ch="${c}" value="${pts[c] ?? 0}"></label>`).join('');
    $('chap-points').querySelectorAll('input').forEach((i) => i.addEventListener('input', updatePtsSum));
    updatePtsSum();
  }
  function updatePtsSum() {
    const sum = [...$('chap-points').querySelectorAll('input')].reduce((s, i) => s + (Number(i.value) || 0), 0);
    const el = $('pts-sum');
    el.textContent = `合計配分：${sum}（建議 120~130；總分仍封頂 100）`;
    el.className = 'pts-sum' + (sum < 100 ? ' warn' : '');
  }
  async function loadConfig() {
    const tok = $('token').value.trim(); if (!tok) return;
    try {
      const c = await fetch('/api/config?token=' + encodeURIComponent(tok)).then((x) => x.json());
      if (c.error) return;
      if (document.activeElement !== $('exam-min')) $('exam-min').value = c.examMinutes ?? 0;
      if (document.activeElement !== $('phase')) $('phase').value = c.phase || 'off';
      if (!cfgBuilt) {
        buildChecks(c.allChapters || [], c.practiceChapters || [], c.examChapters || []);
        buildPoints(c.allChapters || [], c.chapterPoints || {});
      }
    } catch { /* ignore */ }
  }
  const checkedVals = (host) => [...host.querySelectorAll('input:checked')].map((i) => i.value);
  async function setCfg() {
    const tok = $('token').value.trim(); if (!tok) { $('cfg-msg').textContent = '請先輸入 token'; return; }
    const body = {
      token: tok,
      phase: $('phase').value,
      minutes: Number($('exam-min').value),
      practiceChapters: checkedVals($('prac-chaps')),
      examChapters: checkedVals($('exam-chaps')),
      chapterPoints: Object.fromEntries(
        [...$('chap-points').querySelectorAll('input')].map((i) => [i.dataset.ch, Number(i.value)])),
    };
    const r = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then((x) => x.json());
    const m = $('cfg-msg');
    if (r.error) { m.className = 'msg bad'; m.textContent = '設定失敗：' + r.error; }
    else {
      m.className = 'msg';
      const pn = { off: '關閉（全開放）', practice: '練習模式', exam: '正式考試' }[r.phase] || r.phase;
      m.textContent = `已套用：${pn}${r.phase === 'exam' ? `,時長 ${r.examMinutes} 分` : ''}`;
      load();   // refresh matrix with the new exam set / weights
    }
  }
  $('set-cfg').addEventListener('click', setCfg);

  async function resetData() {
    const tok = $('token').value.trim();
    const m = $('reset-msg');
    if (!tok) { m.className = 'msg bad'; m.textContent = '請先輸入 token'; return; }
    const okToGo = confirm(
      '⚠ 確定要「清空所有成績」嗎?\n\n' +
      '將刪除:所有已完成成績、進行中的作答、各生考試開始時間、防重做紀錄。\n' +
      '會保留:考試設定(階段 / 題組 / 配分 / 時長)。\n\n' +
      '注意:Google Sheet 上的資料「不會」被刪除,需自行到試算表清除。\n\n' +
      '此動作無法復原。');
    if (!okToGo) return;
    m.className = 'msg'; m.textContent = '清除中…';
    try {
      const r = await fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: tok }) }).then((x) => x.json());
      if (r.error) { m.className = 'msg bad'; m.textContent = '清除失敗:' + r.error; return; }
      m.className = 'msg'; m.textContent = '已清空成績(設定保留)。';
      load();   // refresh → dashboard now empty
    } catch (e) { m.className = 'msg bad'; m.textContent = '連線失敗:' + e.message; }
  }
  $('reset-data').addEventListener('click', resetData);

  $('load').addEventListener('click', load);
  $('filter').addEventListener('change', render);
  $('token').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  $('auto').addEventListener('change', (e) => {
    clearInterval(timer);
    if (e.target.checked) timer = setInterval(load, 10000);
  });
  if ($('token').value) load();
</script>
</body>
</html>
