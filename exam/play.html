<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過程式測驗 — VisualDS Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="exam.css">
</head>
<body>
<div class="exam-wrapper">
  <div class="exam-col exam-left">
    <a class="back-btn" id="back-btn" href="index.html">‹ 返回章節選單</a>
    <div class="exam-head">
      <span class="exam-title" id="exam-title">過程式測驗</span>
      <span class="exam-sub" id="seed-tag"></span>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="k">得分</div><div class="v" id="stat-score">—</div></div>
      <div class="stat-box"><div class="k">進度</div><div class="v" id="stat-progress">0 / 0</div></div>
      <div class="stat-box"><div class="k">計時</div><div class="v" id="stat-timer">0:00</div></div>
    </div>
    <div class="exam-cd" id="exam-cd" style="display:none"></div>
    <div class="info-call" id="info"></div>
    <div class="step-card" id="step-card"></div>
  </div>
  <div class="exam-col exam-right">
    <div class="canvas-label" id="canvas-label">題目</div>
    <div class="exam-stage" id="stage"></div>
  </div>
</div>

<script type="module">
import { runExam } from './exam-client.js';

const CHAPTERS = {
  'bst-delete':    { module: './render-tree.js' },
  'bst-insert':    { module: './render-bst-insert.js' },
  'bst-traversal': { module: './render-bst-traversal.js' },
  'dijkstra':      { module: './render-graph.js' },
  'dfs':           { module: './render-dfs.js' },
  'bubble-sort':   { module: './render-bubble.js' },
  'selection-sort':{ module: './render-selection.js' },
  'merge-sort':    { module: './render-merge.js' },
};

const params  = new URLSearchParams(location.search);
const chapter = params.get('chapter') || 'bst-delete';
const cfg = CHAPTERS[chapter];

const els = {
  info: document.getElementById('info'),
  seedTag: document.getElementById('seed-tag'),
  statScore: document.getElementById('stat-score'),
  statProgress: document.getElementById('stat-progress'),
  statTimer: document.getElementById('stat-timer'),
  stepCard: document.getElementById('step-card'),
};
const stage = document.getElementById('stage');

// Identity is entered once at the menu (index.html) and remembered here.
const studentId = (localStorage.getItem('vds_exam_sid') || '').trim();

if (!cfg) {
  els.stepCard.innerHTML = `<div class="feedback bad">未知章節:${chapter}</div>`;
} else if (!studentId) {
  // No identity yet → send back to the menu to enter a student id first.
  location.replace('index.html');
} else {
  const renderModule = await import(cfg.module);
  document.getElementById('exam-title').textContent = renderModule.chapterUI.title;
  document.getElementById('canvas-label').textContent = renderModule.chapterUI.canvasLabel;
  runExam({ chapter, studentId, stage, els, renderModule });
  setupExamCountdown(studentId);
}

// Exam-wide countdown (only when a time limit is set + the student has started).
async function setupExamCountdown(studentId) {
  const cd = document.getElementById('exam-cd');
  let info; try { info = await fetch('/api/exam-info?studentId=' + encodeURIComponent(studentId)).then((r) => r.json()); }
  catch { return; }
  if (!info.minutes || !info.endsAt) return;   // no limit, or exam not started
  const skew = info.now - Date.now();
  cd.style.display = '';
  let t;
  const upd = () => {
    const rem = info.endsAt - (Date.now() + skew);
    if (rem <= 0) {
      clearInterval(t);
      cd.classList.add('over'); cd.textContent = '⏰ 考試時間已結束';
      if (!window.__examDone) {
        document.getElementById('step-card').innerHTML =
          `<div class="final-card"><div class="feedback bad">⏰ 考試時間已結束。本關未提交完成的部分不計分。</div>
           <div class="btn-row" style="margin-top:14px"><a class="ex-btn primary" href="index.html" style="text-decoration:none;text-align:center;display:block">← 返回章節選單</a></div></div>`;
      }
      return;
    }
    const s = Math.floor(rem / 1000);
    cd.classList.toggle('low', s <= 60);
    cd.textContent = `⏱ 考試剩餘 ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  upd(); t = setInterval(upd, 1000);
}

// Back-to-menu: warn before abandoning an in-progress (un-submitted) attempt.
document.getElementById('back-btn').addEventListener('click', (e) => {
  if (window.__examDone) return;   // already submitted → safe to leave
  if (!confirm('離開將放棄這一關目前的作答進度(未提交的不會記錄)。確定回選單?')) e.preventDefault();
});
</script>
</body>
</html>
