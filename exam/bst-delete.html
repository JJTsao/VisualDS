<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BST 刪除 · 過程式測驗 — VisualDS Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  .exam-wrapper { height: 100vh; overflow: hidden; display: grid;
    grid-template-columns: minmax(380px, 480px) 1fr; }
  .exam-col { height: 100%; overflow-y: auto; padding: 24px; }
  .exam-left  { border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 18px; }
  .exam-right { position: relative; display: flex; flex-direction: column; gap: 14px; }

  .exam-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .exam-title { font-size: 1.15rem; font-weight: 800; color: var(--amber-bright);
    letter-spacing: .04em; text-transform: uppercase; }
  .exam-sub { font-size: .72rem; color: var(--text-muted); }

  .stat-row { display: flex; gap: 10px; }
  .stat-box { flex: 1; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .stat-box .k { font-size: .62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
  .stat-box .v { font-size: 1.25rem; font-weight: 800; color: var(--amber); margin-top: 2px; }

  .target-call { background: var(--bg-card); border: 1px solid var(--amber-dim); border-radius: 8px;
    padding: 12px 14px; font-size: .85rem; color: var(--text-dim); }
  .target-call b { color: var(--error); font-size: 1.3rem; font-weight: 800; }
  .rules { font-size: .72rem; color: var(--text-muted); line-height: 1.7; margin-top: 8px; }
  .rules b { color: var(--amber); }

  .step-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; display: flex; flex-direction: column; gap: 13px; min-height: 150px; }
  .step-phase { font-size: .68rem; color: var(--amber-dim); text-transform: uppercase; letter-spacing: .1em; }
  .step-prompt { font-size: .92rem; color: var(--text); line-height: 1.6; }
  .step-prompt code { color: var(--amber-bright); font-weight: 700; }

  .opt-grid { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn { cursor: pointer; text-align: left; font-family: var(--font-mono); font-size: .82rem;
    padding: 11px 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card);
    color: var(--text-dim); transition: all .14s; }
  .opt-btn:hover:not(:disabled) { border-color: var(--amber); color: var(--amber-bright); }
  .opt-btn.sel { border-color: #40d0ff; color: #40d0ff; background: rgba(64,208,255,.08); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.reveal-ok  { border-color: var(--success); color: var(--success); background: rgba(80,220,120,.08); }
  .opt-btn.reveal-bad { border-color: var(--error); color: var(--error); }

  .num-wrap { display: flex; align-items: center; gap: 10px; }
  .num-wrap input { width: 110px; background: var(--bg); border: 1px solid var(--border);
    color: var(--amber-bright); font-family: var(--font-mono); font-size: 1.05rem; font-weight: 700;
    text-align: center; padding: 9px; border-radius: 7px; }
  .num-wrap input:focus { outline: none; border-color: var(--amber); }

  .pick-hint { font-size: .78rem; color: var(--text-muted); }
  .pick-chosen { color: #40d0ff; font-weight: 700; }

  .btn-row { display: flex; gap: 10px; }
  .ex-btn { flex: 1; cursor: pointer; font-family: var(--font-mono); font-weight: 700; font-size: .82rem;
    padding: 11px; border-radius: 8px; border: 1px solid var(--amber-dim); background: transparent;
    color: var(--amber); letter-spacing: .04em; transition: all .15s; }
  .ex-btn:hover:not(:disabled) { background: var(--amber); color: var(--bg); }
  .ex-btn.primary { border-color: var(--amber); background: rgba(255,176,0,.08); }
  .ex-btn:disabled { opacity: .35; cursor: not-allowed; }

  .feedback { font-size: .8rem; line-height: 1.6; min-height: 1.2em; }
  .feedback.ok { color: var(--success); }  .feedback.bad { color: var(--error); }  .feedback.hint { color: var(--warn); }

  .canvas-label { font-size: .68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .1em; }
  .tree-stage { position: relative; flex: 1; min-height: 440px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  #bst-edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #bst-edges line { stroke: var(--amber-dim); stroke-width: 2; opacity: .5; }
  #bst-edges line.path { stroke: var(--amber-bright); stroke-width: 3; opacity: .9; }
  #bst-nodes { position: absolute; inset: 0; pointer-events: none; }
  .bst-node { position: absolute; width: 46px; height: 46px; transform: translate(-50%, -50%);
    border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .98rem;
    background: var(--bg-panel); border: 2px solid var(--amber-dim); color: var(--text-dim);
    pointer-events: auto; transition: all .18s; }
  .bst-node.clickable { cursor: pointer; }
  .bst-node.clickable:hover { border-color: var(--amber); color: var(--amber-bright); }
  .bst-node.path    { border-color: var(--amber); color: var(--amber-bright); }
  .bst-node.current { border-color: var(--amber-bright); color: var(--amber-bright);
    box-shadow: 0 0 18px var(--amber-glow); animation: pulseGlow 1.1s infinite; }
  .bst-node.picked  { border-color: #40d0ff; color: #40d0ff; box-shadow: 0 0 14px rgba(64,208,255,.6); }
  .bst-node.target  { border-color: var(--error); color: var(--error); }
  @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 12px var(--amber-glow); } 50% { box-shadow: 0 0 22px var(--amber-glow); } }

  .final-card { text-align: center; padding: 28px; }
  .final-score { font-size: 2.6rem; font-weight: 800; color: var(--amber-bright); }
  .final-sub { color: var(--text-dim); font-size: .85rem; margin-top: 6px; }
</style>
</head>
<body>
<div class="exam-wrapper">
  <div class="exam-col exam-left">
    <div class="exam-head">
      <span class="exam-title">BST 刪除 · 過程式測驗</span>
      <span class="exam-sub" id="seed-tag"></span>
    </div>

    <div class="stat-row">
      <div class="stat-box"><div class="k">得分</div><div class="v" id="stat-score">0%</div></div>
      <div class="stat-box"><div class="k">進度</div><div class="v" id="stat-progress">0 / 0</div></div>
      <div class="stat-box"><div class="k">計時</div><div class="v" id="stat-timer">0:00</div></div>
    </div>

    <div class="target-call">
      請從這棵 BST 刪除值 &nbsp;<b id="target-val">?</b><br>
      <div class="rules">
        逐步手動執行刪除。<b>① 搜尋</b>:從 root 比較大小往左/往右,直到找到。
        <b>② 分類</b>:判斷是葉/一子/兩子。<b>③ 解決</b>:依情況接上子節點,或找中序後繼交換。
      </div>
    </div>

    <div class="step-card" id="step-card"></div>
  </div>

  <div class="exam-col exam-right">
    <div class="canvas-label">題目樹（二元搜尋樹 · 紅圈為待刪值）</div>
    <div class="tree-stage" id="tree-stage">
      <svg id="bst-edges"></svg>
      <div id="bst-nodes"></div>
    </div>
  </div>
</div>

<script type="module">
import { buildBST, layoutTree, bstDeleteTrace } from '../shared/algorithms/bst.js';
import { generateBST } from '../shared/algorithms/bst-gen.js';
import { gradeStep } from '../shared/algorithms/trace-engine.js';

const SVG_NS = 'http://www.w3.org/2000/svg';
const ATTEMPT_CREDIT = [1, 0.5, 0.25];
const PHASE_LABEL = { search: '① 搜尋', classify: '② 分類', resolve: '③ 解決' };

// ── Instance ──────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const seed = params.has('seed') ? (parseInt(params.get('seed'), 10) >>> 0)
                                : (Math.floor(Math.random() * 1e9) >>> 0);
const inst  = generateBST({ n: 9, maxV: 99, seed, prefer: 'two' });
const tree  = buildBST(inst.values);
const pos   = layoutTree(tree);
const trace = bstDeleteTrace(tree, inst.target);

const S = {
  stepIdx: 0, steps: trace.steps,
  attempts: 0, picked: null, settled: false,
  pathNodes: new Set(),      // search nodes already passed
  earned: 0, total: trace.steps.length,
  startMs: null,
};

// ── DOM refs ──────────────────────────────────────────────────────────────────
const stage = document.getElementById('tree-stage');
const svg    = document.getElementById('bst-edges');
const nodesEl= document.getElementById('bst-nodes');
const stepCard = document.getElementById('step-card');
document.getElementById('seed-tag').textContent = 'SEED ' + seed;
document.getElementById('target-val').textContent = inst.target;

// ── Tree rendering ────────────────────────────────────────────────────────────
const nodeEls = new Map();   // id → el
const edgeEls = [];          // { line, parent, child }
function px(frac, dim) { return frac * dim; }
function renderTree() {
  const W = stage.clientWidth, H = stage.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  // edges: parent → each child
  for (const node of tree.nodes.values()) {
    for (const childId of [node.left, node.right]) {
      if (childId === null) continue;
      const P = pos.get(node.id), C = pos.get(childId);
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', px(P.x, W)); line.setAttribute('y1', px(P.y, H));
      line.setAttribute('x2', px(C.x, W)); line.setAttribute('y2', px(C.y, H));
      svg.appendChild(line);
      edgeEls.push({ line, parent: node.id, child: childId });
    }
  }
  // nodes
  for (const node of tree.nodes.values()) {
    const p = pos.get(node.id);
    const el = document.createElement('div');
    el.className = 'bst-node';
    el.style.left = px(p.x, W) + 'px';
    el.style.top  = px(p.y, H) + 'px';
    el.textContent = node.value;
    el.addEventListener('click', () => onNodeClick(node.id));
    nodesEl.appendChild(el);
    nodeEls.set(node.id, el);
  }
  refreshTree();
}

function refreshTree() {
  const step = S.steps[S.stepIdx];
  const focus = step ? step.focusNode : null;
  const isPick = step && step.kind === 'pick-node' && !S.settled;
  for (const [id, el] of nodeEls) {
    el.classList.remove('clickable', 'path', 'current', 'picked', 'target');
    if (S.pathNodes.has(id)) el.classList.add('path');
    if (id === inst.target) el.classList.add('target');
    if (id === focus) el.classList.add('current');
    if (isPick) el.classList.add('clickable');
    if (id === S.picked && isPick) el.classList.add('picked');
  }
  // Highlight edges descended so far: parent already visited, child visited or current.
  for (const e of edgeEls) {
    const onPath = S.pathNodes.has(e.parent) && (S.pathNodes.has(e.child) || e.child === focus);
    e.line.classList.toggle('path', onPath);
  }
}

// ── Stats / timer ─────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('stat-score').textContent =
    (S.total ? Math.round((S.earned / S.total) * 100) : 0) + '%';
  document.getElementById('stat-progress').textContent = `${S.stepIdx} / ${S.total}`;
}
setInterval(() => {
  if (!S.startMs) return;
  const s = Math.floor((Date.now() - S.startMs) / 1000);
  document.getElementById('stat-timer').textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}, 1000);

function creditNow() { return ATTEMPT_CREDIT[Math.min(S.attempts, ATTEMPT_CREDIT.length - 1)]; }

// ── Node click (pick-node phase) ──────────────────────────────────────────────
function onNodeClick(id) {
  const step = S.steps[S.stepIdx];
  if (!step || step.kind !== 'pick-node' || S.settled) return;
  if (S.startMs === null) S.startMs = Date.now();
  S.picked = id;
  refreshTree();
  renderStep();
}

// ── Step rendering ────────────────────────────────────────────────────────────
function renderStep() {
  const step = S.steps[S.stepIdx];
  refreshTree();
  let widget = '';
  if (step.kind === 'choose-dir' || step.kind === 'classify') {
    widget = `<div class="opt-grid">` + step.options.map(o =>
      `<button class="opt-btn ${S.picked === o.value ? 'sel' : ''}" data-val="${o.value}">${o.label}</button>`
    ).join('') + `</div>`;
  } else if (step.kind === 'pick-node') {
    widget = `<div class="pick-hint">已選:<span class="pick-chosen">${S.picked === null ? '（在右圖點一個節點）' : '節點 ' + S.picked}</span></div>`;
  } else if (step.kind === 'number') {
    widget = `<div class="num-wrap"><span class="pick-hint">新值 =</span>
      <input type="text" id="num-in" autocomplete="off" spellcheck="false" value="${S.picked ?? ''}"></div>`;
  }
  const canCheck = step.kind === 'number' ? true : S.picked !== null;
  stepCard.innerHTML = `
    <div class="step-phase">步驟 ${S.stepIdx + 1} / ${S.total} · ${PHASE_LABEL[step.phase] || step.phase}</div>
    <div class="step-prompt">${step.prompt}</div>
    ${widget}
    <div class="btn-row"><button class="ex-btn primary" id="btn-check" ${canCheck ? '' : 'disabled'}>檢查這一步</button></div>
    <div class="feedback" id="fb"></div>`;

  stepCard.querySelectorAll('.opt-btn').forEach(b =>
    b.addEventListener('click', () => { S.picked = b.dataset.val; renderStep(); }));
  const numIn = document.getElementById('num-in');
  if (numIn) { numIn.addEventListener('input', () => { S.picked = numIn.value; }); numIn.focus(); }
  document.getElementById('btn-check').addEventListener('click', submitStep);
}

function parseGiven(step) {
  if (step.kind === 'number') {
    const v = Number((S.picked ?? '').toString().trim());
    return Number.isFinite(v) ? v : NaN;
  }
  return S.picked;
}

function submitStep() {
  const step = S.steps[S.stepIdx];
  if (S.startMs === null) S.startMs = Date.now();
  const res = gradeStep(step, parseGiven(step));
  const fb = document.getElementById('fb');

  if (res.correct) {
    S.earned += creditNow();
    updateStats();
    settle(true, `✓ 正確!`);
    return;
  }
  S.attempts++;
  if (S.attempts >= ATTEMPT_CREDIT.length) {
    settle(false, `正解:${revealText(step)}。此步 0 分,繼續。`);
  } else {
    fb.className = 'feedback hint';
    fb.textContent = hintText(step) + '（可再試,分數遞減）';
  }
}

function revealText(step) {
  if (step.kind === 'choose-dir' || step.kind === 'classify') {
    const o = step.options.find(x => x.value === step.answer);
    return o ? o.label : step.answer;
  }
  return step.answer;
}
function hintText(step) {
  switch (step.kind) {
    case 'choose-dir': return '提示:目標比目前節點小往左、大往右,相等就是找到。';
    case 'classify':   return '提示:看這個節點有幾個非空子節點。';
    case 'pick-node':  return '提示:中序後繼 = 右子樹一路往左走到底;取代節點 = 它唯一的子節點。';
    case 'number':     return '提示:兩子情況下,複製上來的是「中序後繼」的值。';
    default: return '再試一次。';
  }
}

function settle(correct, msg) {
  S.settled = true;
  const fb = document.getElementById('fb');
  fb.className = 'feedback ' + (correct ? 'ok' : 'bad');
  fb.textContent = msg;
  // reveal on the option buttons
  const step = S.steps[S.stepIdx];
  if (step.kind === 'choose-dir' || step.kind === 'classify') {
    stepCard.querySelectorAll('.opt-btn').forEach(b => {
      b.disabled = true;
      if (b.dataset.val === step.answer) b.classList.add('reveal-ok');
      else if (b.classList.contains('sel') && !correct) b.classList.add('reveal-bad');
    });
  } else if (step.kind === 'number') {
    const inp = document.getElementById('num-in'); if (inp) { inp.value = step.answer; inp.disabled = true; }
  }
  document.getElementById('btn-check').remove();
  const row = stepCard.querySelector('.btn-row');
  row.innerHTML = `<button class="ex-btn primary" id="btn-next">${S.stepIdx + 1 >= S.total ? '看結果 →' : '下一步 →'}</button>`;
  document.getElementById('btn-next').addEventListener('click', advance);
  refreshTree();
}

function advance() {
  const step = S.steps[S.stepIdx];
  if (step.phase === 'search' && step.focusNode != null) S.pathNodes.add(step.focusNode);
  S.stepIdx++;
  S.attempts = 0; S.picked = null; S.settled = false;
  updateStats();
  if (S.stepIdx >= S.total) { finish(); return; }
  renderStep();
}

function finish() {
  for (const [, el] of nodeEls) el.classList.remove('clickable', 'current', 'picked');
  const pct  = Math.round((S.earned / S.total) * 100);
  const secs = S.startMs ? Math.floor((Date.now() - S.startMs) / 1000) : 0;
  stepCard.innerHTML = `
    <div class="final-card">
      <div class="final-score">${pct}%</div>
      <div class="final-sub">${S.earned.toFixed(2)} / ${S.total} 計分單位 · 用時 ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</div>
      <div class="final-sub">（本題刪除 ${inst.target} 屬「${{leaf:'葉節點',one:'一個子節點',two:'兩個子節點'}[trace.klass]}」情況）</div>
      <div class="btn-row" style="margin-top:18px">
        <button class="ex-btn" onclick="location.href='?seed='+((${seed}+1)>>>0)">換一題</button>
        <button class="ex-btn primary" onclick="location.reload()">重做本題</button>
      </div>
    </div>`;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
renderTree();
updateStats();
renderStep();
</script>
</body>
</html>
